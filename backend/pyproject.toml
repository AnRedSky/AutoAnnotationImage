[project]
name = "image-annotation-backend"
version = "0.1.0"
description = "基于深度学习的图像自动标注系统 - 后端服务 (API + Celery Worker)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Annotation Platform Team" }
]

# =====================================================================
#  依赖列表（单一真实来源）
#  - 与 Dockerfile 中 `uv sync --frozen --no-install-project` 配套
#  - uv.lock 已生成，安装/构建走 lock 文件
#  - 与 requirements.txt 保持同步（requirements.txt 仅做兼容保留）
# =====================================================================
dependencies = [
    # ----- FastAPI 异步后端 -----
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "python-multipart==0.0.9",
    # ----- 数据库 (MySQL + SQLite 测试) -----
    "sqlalchemy[asyncio]==2.0.27",
    "aiomysql==0.2.0",
    "pymysql==1.1.0",
    "alembic==1.13.1",
    "aiosqlite==0.20.0",
    # ----- 鉴权与安全 -----
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.2",
    # v3.0.0 审查修复 P2-8 移除未用的 passlib
    # ----- 数据建模 -----
    "pydantic==2.6.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.0",
    # ----- 深度学习 -----
    "torch==2.2.0",
    "torchvision==0.17.0",
    "timm==0.9.12",
    "Pillow==10.2.0",
    "albumentations==1.3.1",
    # ----- ML Utilities -----
    "scikit-learn==1.4.1.post1",
    "numpy==1.26.4",
    # ----- 检测与分割 (v2.0.0) -----
    "ultralytics==8.0.196",
    "opencv-python==4.9.0.80",
    # ----- 异步任务 (Celery + Redis broker) -----
    "celery==5.3.6",
    "redis==5.0.3",
    # ----- 存储 -----
    "minio==7.2.4",
    "aiofiles==23.2.1",
    # ----- 配置 -----
    "python-dotenv==1.0.1",
    # ----- 日志 -----
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.3.5",
    "mypy==1.9.0",
]

# =====================================================================
#  console scripts: `uv run <script>` 直启动
#    - api     : 启动 FastAPI 服务
#    - worker  : 启动 Celery worker (默认合并 train+annotate 队列)
#    - worker-train / worker-annotate: 拆分队列
# =====================================================================
[project.scripts]
api              = "app.main:run"
worker           = "app.tasks.workers.celery_app:run_worker"
worker-train     = "app.tasks.workers.celery_app:run_worker_train"
worker-annotate  = "app.tasks.workers.celery_app:run_worker_annotate"
healthcheck      = "app.core.healthcheck:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

# =====================================================================
#  PEP 735 dependency groups（取代已废弃的 [tool.uv.dev-dependencies]）
#  - `uv sync` / `uv run` 默认会安装 dev 组
#  - `uv sync --no-group dev` 可仅装生产依赖
#  - 注意：与下面 `[[tool.uv.index]]` / `[tool.uv.sources]` 同属 uv 配置
#    但 dev 依赖已迁出，PyTorch CUDA 索引仍按原配置生效
# =====================================================================
[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.3.5",
]

# =====================================================================
#  PyTorch CUDA 索引（v3.3.3 启用）
#  ---------------------------------------------------------------
#  默认从 PyTorch 官方 cu121 索引拉 torch/torchvision, 这样
#  uv sync 直接得到带 CUDA 12.1 的 wheel, 装上即可调用 RTX GPU.
#
#  - explicit = true 保证该 index 只服务显式声明的包, 不会污染
#    ultralytics/timm/numpy 等其它依赖的解析来源.
#  - 配套 Python 版本: cp310 / cp311 (cu121 官方 wheel 不发 cp312)
#    Dockerfile (python:3.10-slim) 与 uv venv 默认 cp311 都已对齐.
#  - 临时回退 CPU-only: uv pip install --index-url
#    https://download.pytorch.org/whl/cpu torch==2.2.0 torchvision==0.17.0
# =====================================================================
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: 慢测试 (大模型/大数据集, 默认跳过)",
    "gpu: 需要 CUDA 设备",
    "eager: Celery eager 模式 worker 测试",
    "perf: 性能基准测试 (默认 opt-out, 跑法: pytest -m perf)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=39",
]
