[project]
name = "image-annotation-backend"
version = "0.1.0"
description = "基于深度学习的图像自动标注系统 - 后端服务"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thesis Author" }
]
dependencies = [
    # FastAPI async backend
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "python-multipart==0.0.9",
    # Database
    "sqlalchemy[asyncio]==2.0.27",
    "aiomysql==0.2.0",
    "pymysql==1.1.0",
    "alembic==1.13.1",
    # Auth & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    # Pydantic
    "pydantic==2.6.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.0",
    # Deep Learning
    "torch==2.2.0",
    "torchvision==0.17.0",
    "timm==0.9.12",
    "Pillow==10.2.0",
    "albumentations==1.3.1",
    # ML Utilities
    "scikit-learn==1.4.1.post1",
    "numpy==1.26.4",
    # Async Tasks
    "celery==5.3.6",
    "redis==5.0.3",
    # Storage
    "minio==7.2.4",
    # Config
    "python-dotenv==1.0.1",
    # Logging
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "httpx==0.27.0",
    "ruff==0.3.5",
    "mypy==1.9.0",
]

[project.scripts]
image-annotation-backend = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.uv]
dev-dependencies = [
    "pytest==8.1.1",
    "httpx==0.27.0",
    "ruff==0.3.5",
]
