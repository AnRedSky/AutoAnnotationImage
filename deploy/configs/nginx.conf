# =====================================================================
#  Image Annotation Frontend - Nginx Configuration (v3.3.0)
# ---------------------------------------------------------------------
#  关键能力:
#    1) /api/*   → 反代到 backend (FastAPI on :8000)
#    2) /docs    → 反代到 backend (Swagger UI)
#    3) /redoc   → 反代到 backend (ReDoc)
#    4) /openapi.json → 反代到 backend
#    5) SPA 路由: history 模式下所有非 /api 请求回退到 /index.html
#    6) SSE 支持: proxy_buffering off, proxy_read_timeout 长
#    7) 静态资源: 1 年强缓存 (带 hash 的 Vite 产物)
#    8) 安全头: X-Frame-Options, CSP, HSTS 等
#
#  端口: 8080 (非 root)
#  后端地址: 通过 docker compose 环境变量注入, 默认为 api:8000
# =====================================================================

# 上游 (upstream) - 由 docker compose 的环境变量解析得到
# 容器内 DNS 会把 "api" 解析到 FastAPI 服务
upstream annotation_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # 根目录: Vite 构建产物
    root /usr/share/nginx/html;
    index index.html;

    # ============== 通用设置 ==============
    charset utf-8;
    client_max_body_size 25M;        # 略大于后端 MAX_UPLOAD_SIZE_MB
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============== 安全响应头 ==============
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 允许同源 + 内联 (Vue/Element Plus 常用内联 style)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:;" always;

    # ============== 健康检查端点 ==============
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ============== 后端 API 反代 ==============
    # /api/*  → api:8000/api/*
    location /api/ {
        proxy_pass http://annotation_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 超时 (上传/训练接口可能耗时较长)
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 缓冲 (SSE 必须关闭)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Swagger UI
    location = /docs {
        proxy_pass http://annotation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /docs/ {
        proxy_pass http://annotation_api;
        proxy_set_header Host $host;
    }
    location ~ ^/docs/.*$ {
        proxy_pass http://annotation_api;
        proxy_set_header Host $host;
    }

    # ReDoc
    location = /redoc {
        proxy_pass http://annotation_api;
        proxy_set_header Host $host;
    }

    # OpenAPI schema
    location = /openapi.json {
        proxy_pass http://annotation_api;
        proxy_set_header Host $host;
    }

    # ============== 静态资源 (带 hash 文件, 长期缓存) ==============
    # Vite 输出文件名含 hash (assets/index-xxxx.js)
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # favicon
    location = /favicon.ico {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============== SPA 路由 fallback ==============
    # Vue Router history 模式: 所有非 /api 请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============== 错误页 ==============
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 隐藏 nginx 版本
    server_tokens off;
}
