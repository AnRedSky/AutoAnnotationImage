# 一键部署 Docker Compose
# =========================================
# 启动: docker compose up -d
# 停止: docker compose down
# 重建: docker compose build --no-cache
#
# 端口分配 (与后端 .env.docker 配合使用):
#   8000  FastAPI 后端
#   5173  Vue 前端 (开发模式 HMR)
#   3306  MySQL 8
#   6379  Redis 7
#   9000  MinIO API
#   9001  MinIO Console (Web UI)

version: '3.8'

services:
  # ============ 基础服务 ============
  mysql:
    image: mysql:8.0
    container_name: annotation_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: image_annotation
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: annotation_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: annotation_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ 应用服务 ============
  backend:
    build: ./backend
    container_name: annotation_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - model_data:/app/models
      - upload_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: ./backend
    container_name: annotation_celery
    env_file:
      - ./backend/.env.docker
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - model_data:/app/models
      - upload_data:/app/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  frontend:
    image: node:20-alpine
    container_name: annotation_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  minio_data:
  model_data:
  upload_data:
