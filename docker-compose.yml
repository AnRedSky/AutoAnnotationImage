# =============================================================================
#  Image Annotation System - Docker Compose (v3.6.0 精简版)
# -----------------------------------------------------------------------------
#  拆分:
#    - mysql          : MySQL 8.0 主数据库
#    - redis          : Redis 7 缓存 + Celery broker/backend
#    - minio          : MinIO 对象存储
#    - api            : FastAPI / Uvicorn (Dockerfile.api, target=api)
#    - worker-train   : Celery train 队列 (concurrency=1)
#    - worker-annotate: Celery annotate 队列 (concurrency=4)
#    - frontend       : Vue 3 + Nginx 生产构建 (静态托管 + /api 反代)
#
#  配置策略 (v3.6.0 精简):
#    - 全部环境变量统一从项目根 .env 读取 (env_file: - .env)
#    - compose 里 environment 只保留"容器内必须覆盖"的值
#      (服务名 / 容器内绝对路径 / 容器特定开关),
#      不再重复声明 .env 里已有的密码/端口等
#    - ${VAR:?msg} 形式仍用于显式强制检查关键变量
#
#  启动:  docker compose up -d
#  停止:  docker compose down
#  重建:  docker compose build --no-cache
#
#  端口 (宿主机:容器):
#    3306  MySQL
#    6379  Redis
#    9000  MinIO API
#    9001  MinIO Console
#    8000  FastAPI
#    8080  Nginx 前端 (含 /api 反代)
# =============================================================================

# -----------------------------
#  公共配置: x-logging 锚点
# -----------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"        # 单文件最大 20MB
    max-file: "5"          # 保留 5 个滚动文件
    labels: "service,environment"

# -----------------------------
#  公共配置: x-restart 锚点
# -----------------------------
x-restart: &default-restart
  restart: unless-stopped

services:
  # ================== 基础设施 ==================
  mysql:
    image: mysql:8.0
    container_name: annotation_mysql
    <<: *default-restart
    env_file:
      - .env
    environment:
      # 强制检查关键变量 (避免 .env 漏配时静默启动)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      # 容器的 charset/collation/TZ 是部署硬性要求, 写死 (与 .env 解耦)
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - annotation_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    # 资源限制 (生产基线, 可按需调整)
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 200

  redis:
    image: redis:7-alpine
    container_name: annotation_redis
    <<: *default-restart
    env_file:
      - .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - annotation_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    mem_limit: 1g
    cpus: "1.0"

  minio:
    image: minio/minio:latest
    container_name: annotation_minio
    <<: *default-restart
    env_file:
      - .env
    command: server /data --console-address ":9001"
    environment:
      # MinIO 必须用 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD, 与 .env 的 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 对应
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - annotation_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    mem_limit: 2g
    cpus: "2.0"

  # ================== 应用服务 ==================
  # v3.6.0 精简: API / worker 全部从 .env 读通用配置,
  #             environment 只覆盖"容器内必须不同"的服务名/路径
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
      target: api
    image: annotation/api:local
    container_name: annotation_api
    <<: *default-restart
    env_file:
      - .env
    environment:
      # ----- 容器内服务名 (覆盖 .env 中可能的 localhost) -----
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/models
      - upload_data:/app/uploads
      - api_logs:/app/logs
    networks:
      - annotation_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    # 资源限制
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 500
    # 安全选项
    security_opt:
      - no-new-privileges:true
    read_only: false     # /app/uploads /app/models 需写

  # 训练 worker: CPU/GPU 密集, concurrency=1
  worker-train:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      target: worker
    image: annotation/worker:local
    container_name: annotation_worker_train
    <<: *default-restart
    env_file:
      - .env
    environment:
      # 容器内服务名 (覆盖 .env)
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      # v3.6.0: 容器内 HF_HOME 显式指向 /app/models/cache/huggingface (持久化卷),
      #         避免 base 镜像自带 HF_HOME 默认 /root/.cache/huggingface 导致容器重建丢缓存.
      #         根 .env 留空 (本地开发用), 故此处必须显式注入容器内路径.
      HF_HOME: /app/models/cache/huggingface
    volumes:
      - model_data:/app/models
      - upload_data:/app/uploads
      - api_logs:/app/logs
    networks:
      - annotation_net
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.workers.celery_app inspect ping -d celery@$$(hostname) --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    command: >
      celery -A app.tasks.workers.celery_app worker
      --loglevel=info --pool=threads --concurrency=1 -Q train
    mem_limit: 8g
    cpus: "4.0"
    security_opt:
      - no-new-privileges:true

  # 标注 worker: I/O 密集, concurrency=4
  worker-annotate:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      target: worker
    image: annotation/worker:local
    container_name: annotation_worker_annotate
    <<: *default-restart
    env_file:
      - .env
    environment:
      # 容器内服务名 (覆盖 .env)
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      # v3.6.0: 容器内 HF_HOME 显式指向 /app/models/cache/huggingface (持久化卷),
      #         同 worker-train 注释.
      HF_HOME: /app/models/cache/huggingface
    volumes:
      - model_data:/app/models
      - upload_data:/app/uploads
      - api_logs:/app/logs
    networks:
      - annotation_net
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.workers.celery_app inspect ping -d celery@$$(hostname) --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    command: >
      celery -A app.tasks.workers.celery_app worker
      --loglevel=info --pool=threads --concurrency=4 -Q annotate
    mem_limit: 6g
    cpus: "4.0"
    security_opt:
      - no-new-privileges:true

  # ================== 前端 (生产) ==================
  # Vue 3 + Vite 多阶段构建 → Nginx 静态托管
  # nginx 自动将 /api/* 反代到 api:8000, 同源部署避免 CORS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # 构建期 API baseURL, 默认空=同源 (走 nginx 反代)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: annotation/frontend:local
    container_name: annotation_frontend
    <<: *default-restart
    # v3.3.2: nginx master 需 root 创建 tmpfs 缓存目录, worker 仍降权
    user: "0:0"
    ports:
      - "8080:8080"
    networks:
      - annotation_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging
    mem_limit: 256m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

# ================== 网络 ==================
networks:
  annotation_net:
    driver: bridge
    name: annotation_net

# ================== 持久化卷 ==================
volumes:
  mysql_data:
    name: annotation_mysql_data
  redis_data:
    name: annotation_redis_data
  minio_data:
    name: annotation_minio_data
  model_data:
    name: annotation_model_data
  upload_data:
    name: annotation_upload_data
  api_logs:
    name: annotation_api_logs
