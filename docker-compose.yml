# =============================================================================
#  Image Annotation System - Docker Compose (v3.3.0 一键部署版)
# -----------------------------------------------------------------------------
#  拆分：
#    - mysql          : MySQL 8.0 主数据库
#    - redis          : Redis 7 缓存 + Celery broker/backend
#    - minio          : MinIO 对象存储
#    - api            : FastAPI / Uvicorn (Dockerfile.api, target=api)
#    - worker-train   : Celery train 队列 (concurrency=1)
#    - worker-annotate: Celery annotate 队列 (concurrency=4)
#    - frontend       : Vue 3 + Nginx 生产构建 (静态托管 + /api 反代)
#
#  配置: 统一从项目根 .env 读取 (无需 --env-file 参数)
#  启动:  docker compose up -d
#  停止:  docker compose down
#  重建:  docker compose build --no-cache
#
#  端口 (宿主机:容器):
#    3306  MySQL
#    6379  Redis
#    9000  MinIO API
#    9001  MinIO Console
#    8000  FastAPI
#    8080  Nginx 前端 (含 /api 反代)
# =============================================================================

# -----------------------------
#  公共配置：x-logging 锚点
# -----------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"        # 单文件最大 20MB
    max-file: "5"          # 保留 5 个滚动文件
    labels: "service,environment"

# -----------------------------
#  公共配置：x-restart 锚点
# -----------------------------
x-restart: &default-restart
  restart: unless-stopped

services:
  # ================== 基础设施 ==================
  mysql:
    image: mysql:8.0
    container_name: annotation_mysql
    <<: *default-restart
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-image_annotation}
      MYSQL_USER: ${MYSQL_USER:-annotation}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - annotation_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    # 资源限制（生产基线，可按需调整）
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 200

  redis:
    image: redis:7-alpine
    container_name: annotation_redis
    <<: *default-restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - annotation_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    mem_limit: 1g
    cpus: "1.0"

  minio:
    image: minio/minio:latest
    container_name: annotation_minio
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - annotation_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    mem_limit: 2g
    cpus: "2.0"

  # ================== 应用服务 ==================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
      target: api
    image: annotation/api:local
    container_name: annotation_api
    <<: *default-restart
    env_file:
      - .env
    environment:
      # 容器内服务名 (覆盖 .env 中的宿主机 localhost)
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      # 使用 docker compose 服务名（容器内 DNS 自动解析）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      # 容器内绝对路径（避免 ./uploads 解析问题）
      UPLOAD_DIR: /app/uploads
      MODEL_DIR: /app/models
      # 容器内不走 HF 镜像环境变量
      HF_HUB_DISABLE_SYMLINKS: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/models
      - upload_data:/app/uploads
      - api_logs:/app/logs
      - ./backend/app:/app/app
    networks:
      - annotation_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    # 资源限制
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 500
    # 安全选项
    security_opt:
      - no-new-privileges:true
    read_only: false     # /app/uploads /app/models 需写

  # 训练 worker：CPU/GPU 密集，concurrency=1
  worker-train:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      target: worker
    image: annotation/worker:local
    container_name: annotation_worker_train
    <<: *default-restart
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      UPLOAD_DIR: /app/uploads
      MODEL_DIR: /app/models
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
      HF_HUB_DISABLE_SYMLINKS: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    volumes:
      - model_data:/app/models
      - upload_data:/app/uploads
      - api_logs:/app/logs
      - ./backend/app:/app/app
    networks:
      - annotation_net
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.workers.celery_app inspect ping -d celery@$$(hostname) --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    command: >
      celery -A app.tasks.workers.celery_app worker
      --loglevel=info --pool=threads --concurrency=1 -Q train
    mem_limit: 8g
    cpus: "4.0"
    security_opt:
      - no-new-privileges:true

  # 标注 worker：I/O 密集，concurrency=4
  worker-annotate:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      target: worker
    image: annotation/worker:local
    container_name: annotation_worker_annotate
    <<: *default-restart
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      UPLOAD_DIR: /app/uploads
      MODEL_DIR: /app/models
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
      HF_HUB_DISABLE_SYMLINKS: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    volumes:
      - model_data:/app/models
      - upload_data:/app/uploads
      - api_logs:/app/logs
      - ./backend/app:/app/app
    networks:
      - annotation_net
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.workers.celery_app inspect ping -d celery@$$(hostname) --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    command: >
      celery -A app.tasks.workers.celery_app worker
      --loglevel=info --pool=threads --concurrency=4 -Q annotate
    mem_limit: 6g
    cpus: "4.0"
    security_opt:
      - no-new-privileges:true

  # ================== 前端 (生产) ==================
  # Vue 3 + Vite 多阶段构建 → Nginx 静态托管
  # nginx 自动将 /api/* 反代到 api:8000, 同源部署避免 CORS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # 构建期 API baseURL, 默认空=同源 (走 nginx 反代)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: annotation/frontend:local
    container_name: annotation_frontend
    <<: *default-restart
    # v3.3.2: nginx master 需 root 创建 tmpfs 缓存目录, worker 仍降权
    user: "0:0"
    ports:
      - "8080:8080"
    networks:
      - annotation_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging
    mem_limit: 256m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

# ================== 网络 ==================
networks:
  annotation_net:
    driver: bridge
    name: annotation_net

# ================== 持久化卷 ==================
volumes:
  mysql_data:
    name: annotation_mysql_data
  redis_data:
    name: annotation_redis_data
  minio_data:
    name: annotation_minio_data
  model_data:
    name: annotation_model_data
  upload_data:
    name: annotation_upload_data
  api_logs:
    name: annotation_api_logs
